</style></head><body><div class="toolbar"><h2>KZ AGRO • Template Surat Rasmi</h2><div class="buttons"><button onclick="window.print()">Simpan PDF / Cetak</button><button onclick="copyLetter()">Salin Teks</button><button onclick="resetForm()">Kosongkan Surat</button></div></div><section class="editor"><label>Tarikh</label><input id="date" type="date"><label>Kepada</label><input id="to" value="Pihak yang berkenaan"><label>Tajuk surat</label><input id="subject" value="PERMOHONAN PENJELASAN DAN PENUKARAN MESIN"><label>Isi surat (boleh ubah sesuka hati)</label><textarea id="message">Assalamualaikum.

Merujuk kepada mesin pengupas nanas yang telah dibekalkan kepada KZ Agro Resources, saya ingin memaklumkan bahawa mesin tersebut tidak memenuhi keperluan operasi dan hasil kupasan yang telah saya tunjukkan sebelum ini.

Saya memohon jawapan bertulis berhubung penukaran mesin ini selewat-lewatnya pada 24 November 2026.

Saya berharap perkara ini dapat diselesaikan dengan baik dan profesional.
